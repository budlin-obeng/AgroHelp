<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="leafGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="fertShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer Glow -->
  <circle cx="60" cy="60" r="54" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>

  <g filter="url(#fertShadow)">
    <!-- Natural Nitrogen Sprout Bursting from Behind Sack -->
    <g transform="translate(36, 12)">
      <path d="M0 24 C-10 14 -18 8 -24 10 C-26 18 -18 26 0 28 Z" fill="url(#leafGradF)" stroke="#15803D" stroke-width="1.2"/>
      <path d="M4 24 C14 12 26 10 32 14 C32 24 20 28 4 28 Z" fill="url(#leafGradF)" stroke="#15803D" stroke-width="1.2"/>
      <path d="M2 28 L2 38" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Chemical Fertilizer Polypropylene Sack Body -->
    <!-- Stitched Top Edge -->
    <path d="M28 32 L84 32 L88 38 L24 38 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <line x1="26" y1="35" x2="86" y2="35" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Bag Trunk -->
    <path d="M25 38 L87 38 L92 98 C92 102 88 106 82 106 L30 106 C24 106 20 102 20 98 Z" 
          fill="url(#bagGrad)" stroke="#475569" stroke-width="1.8"/>

    <!-- Blue Chevron Fertilizer Brand Stripe -->
    <path d="M22 52 L90 52 L91 66 L21 66 Z" fill="#0284C7"/>
    <!-- N-P-K Labeling (Bold high-contrast text) -->
    <text x="56" y="63" font-family="Arial, sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">NPK</text>
    <text x="56" y="77" font-family="Arial, sans-serif" font-weight="700" font-size="8" text-anchor="middle" fill="#64748B">15 - 15 - 15</text>

    <!-- Large Green Savings Badge / Discount Shield (Foreground Right) -->
    <g transform="translate(62, 54)">
      <!-- Shield Shape -->
      <path d="M24 0 C38 0 46 8 46 18 C46 36 28 50 24 54 C20 50 2 36 2 18 C2 8 10 0 24 0 Z" 
            fill="url(#shieldGrad)" stroke="#052E16" stroke-width="2"/>
      <!-- Inner Shield Accent Line -->
      <path d="M24 4 C34 4 41 11 41 19 C41 33 26 45 24 48 C22 45 7 33 7 19 C7 11 14 4 24 4 Z" 
            fill="none" stroke="#86EFAC" stroke-width="1.2"/>

      <!-- Downward Cost-Cutting Arrow + Percent Symbol -->
      <text x="24" y="26" font-family="Arial, sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#FFFFFF">%</text>
      <!-- Downward Arrow (Slashing Fertilizer Cost) -->
      <path d="M24 30 L24 44 M18 38 L24 44 L30 38" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Fertilizer Granules Pouring Out Base -->
    <circle cx="28" cy="98" r="2" fill="#38BDF8"/>
    <circle cx="34" cy="96" r="2" fill="#CBD5E1"/>
    <circle cx="30" cy="102" r="2" fill="#FDE047"/>
    <circle cx="38" cy="100" r="2" fill="#38BDF8"/>
  </g>
</svg>
