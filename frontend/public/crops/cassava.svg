<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tuberSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="tuberFlesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="leafGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="70%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <filter id="cassavaShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="60" cy="60" r="54" fill="#FEFCE8" stroke="#FEF08A" stroke-width="2"/>

  <g filter="url(#cassavaShadow)">
    <!-- Iconic Palmate Hand-Shaped Leaf (Top Half) -->
    <g transform="translate(60, 36)">
      <!-- Red / Crimson Petiole Stems -->
      <path d="M0 8 C0 18 2 28 4 36" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Radiating 5 Palmate Leaf Lobes -->
      <!-- Center Upright Lobe -->
      <path d="M0 6 C-4 -8 -6 -24 0 -30 C6 -24 4 -8 0 6 Z" fill="url(#leafGradC)" stroke="#14532D" stroke-width="1.2"/>
      <line x1="0" y1="4" x2="0" y2="-28" stroke="#86EFAC" stroke-width="1"/>

      <!-- Upper Left Lobe -->
      <path d="M-2 6 C-12 -2 -24 -12 -28 -18 C-22 -22 -10 -14 -2 6 Z" fill="url(#leafGradC)" stroke="#14532D" stroke-width="1.2"/>
      <line x1="-2" y1="5" x2="-26" y2="-17" stroke="#86EFAC" stroke-width="0.9"/>

      <!-- Far Left Lobe -->
      <path d="M-3 7 C-16 6 -28 4 -32 -2 C-30 -8 -16 -2 -3 7 Z" fill="url(#leafGradC)" stroke="#14532D" stroke-width="1.2"/>

      <!-- Upper Right Lobe -->
      <path d="M2 6 C12 -2 24 -12 28 -18 C22 -22 10 -14 2 6 Z" fill="url(#leafGradC)" stroke="#14532D" stroke-width="1.2"/>
      <line x1="2" y1="5" x2="26" y2="-17" stroke="#86EFAC" stroke-width="0.9"/>

      <!-- Far Right Lobe -->
      <path d="M3 7 C16 6 28 4 32 -2 C30 -8 16 -2 3 7 Z" fill="url(#leafGradC)" stroke="#14532D" stroke-width="1.2"/>

      <!-- Central Petiole Junction Hub -->
      <circle cx="0" cy="7" r="3" fill="#BE123C"/>
    </g>

    <!-- Whole Cassava Tuber (Long, tapered root) -->
    <g transform="rotate(18 52 82)">
      <!-- Tapered Root Body -->
      <path d="M24 72 C32 64 68 62 88 68 C100 72 106 78 108 82 C104 88 94 92 84 94 C64 96 28 92 24 82 C22 78 22 74 24 72 Z" 
            fill="url(#tuberSkin)" stroke="#3E1A05" stroke-width="1.5"/>
      <!-- Bark Rings / Rough Striations -->
      <path d="M42 66 C44 76 43 88 41 94 M58 64 C60 76 59 88 57 95 M74 65 C76 77 75 87 72 94 M88 69 C90 77 88 85 86 91" 
            stroke="#542407" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- Root Fibers / Tips -->
      <path d="M108 82 C114 84 118 86 122 85" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Cut Cross-Section Revealing White Starchy Flesh (Foreground Left) -->
    <g transform="translate(18, 62)">
      <!-- Outer Bark Rim -->
      <ellipse cx="20" cy="22" rx="15" ry="19" fill="#78350F" stroke="#3E1A05" stroke-width="1.5"/>
      <!-- Pinkish Under-Bark Cambium -->
      <ellipse cx="20" cy="22" rx="13.5" ry="17.5" fill="#FBCFE8"/>
      <!-- Pure White Starchy Flesh Core -->
      <ellipse cx="20" cy="22" rx="12" ry="16" fill="url(#tuberFlesh)" stroke="#E2E8F0" stroke-width="0.8"/>
      <!-- Central Fibrous Vascular Dot -->
      <circle cx="20" cy="22" r="2.2" fill="#94A3B8"/>
      <line x1="20" y1="12" x2="20" y2="32" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="1 2"/>
    </g>
  </g>
</svg>
