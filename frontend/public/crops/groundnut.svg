<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="shellInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="leafGradG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="peanutShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="60" cy="60" r="54" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>

  <g filter="url(#peanutShadow)">
    <!-- Groundnut Plant Foliage (Top Left) -->
    <g transform="translate(18, 12)">
      <!-- Leaflet Stem -->
      <path d="M42 36 C34 26 24 20 14 18" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- 4 Rounded Leaflets characteristic of Arachis hypogaea -->
      <ellipse cx="14" cy="14" rx="10" ry="7" transform="rotate(-30 14 14)" fill="url(#leafGradG)" stroke="#14532D" stroke-width="1.2"/>
      <ellipse cx="28" cy="10" rx="10" ry="7" transform="rotate(10 28 10)" fill="url(#leafGradG)" stroke="#14532D" stroke-width="1.2"/>
      <ellipse cx="20" cy="28" rx="9" ry="6" transform="rotate(-45 20 28)" fill="url(#leafGradG)" stroke="#14532D" stroke-width="1.2"/>
      <ellipse cx="36" cy="22" rx="9" ry="6" transform="rotate(25 36 22)" fill="url(#leafGradG)" stroke="#14532D" stroke-width="1.2"/>

      <!-- Small Golden Yellow Flower -->
      <circle cx="44" cy="34" r="5.5" fill="#FACC15" stroke="#CA8A04" stroke-width="1"/>
      <circle cx="44" cy="34" r="2.5" fill="#EA580C"/>
    </g>

    <!-- Whole Peanut In Shell (Right / Back) -->
    <g transform="rotate(25 78 58)">
      <!-- Classic 2-lobed constricted peanut shell -->
      <path d="M64 36 C56 40 56 50 62 56 C57 62 58 74 66 78 C74 82 84 76 84 66 C80 60 84 52 78 44 C74 36 68 34 64 36 Z" 
            fill="url(#shellGrad)" stroke="#78350F" stroke-width="1.5"/>
      <!-- Reticulated Shell Texture Ridges -->
      <path d="M62 42 C68 40 74 44 76 48 M60 50 C66 48 72 52 74 54 M63 60 C68 58 76 60 80 64 M66 70 C72 68 76 72 80 74" 
            stroke="#FEF3C7" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M68 38 L67 76" stroke="#92400E" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
    </g>

    <!-- Cracked Open Peanut Pod Showing 2 Kernels (Front / Left) -->
    <g transform="rotate(-15 50 72)">
      <!-- Lower Shell Half (Cup) -->
      <path d="M26 48 C20 54 20 66 28 74 C24 82 26 94 36 98 C48 102 60 94 60 82 C56 74 60 62 52 52 C44 42 34 42 26 48 Z" 
            fill="url(#shellGrad)" stroke="#78350F" stroke-width="1.5"/>
      <!-- Inner Shell Hollow Lining -->
      <path d="M29 52 C24 57 24 65 30 71 C28 78 30 89 38 92 C46 95 54 88 54 80 C51 73 54 64 47 55 C41 47 34 47 29 52 Z" 
            fill="url(#shellInner)" stroke="#B45309" stroke-width="1"/>

      <!-- Bottom Red Peanut Kernel -->
      <ellipse cx="40" cy="80" rx="9" ry="6.5" transform="rotate(-30 40 80)" fill="url(#kernelGrad)" stroke="#581C87" stroke-width="1"/>
      <ellipse cx="38" cy="78" rx="7" ry="2" transform="rotate(-30 38 78)" fill="#F87171" opacity="0.5"/>
      <!-- Tip germ spot -->
      <circle cx="34" cy="74" r="1.5" fill="#FEF3C7"/>

      <!-- Top Red Peanut Kernel -->
      <ellipse cx="37" cy="59" rx="8.5" ry="6" transform="rotate(-25 37 59)" fill="url(#kernelGrad)" stroke="#581C87" stroke-width="1"/>
      <ellipse cx="35" cy="57" rx="6.5" ry="1.8" transform="rotate(-25 35 57)" fill="#F87171" opacity="0.5"/>
      <circle cx="31" cy="54" r="1.5" fill="#FEF3C7"/>
    </g>
  </g>
</svg>
