<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blackEarthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="humusDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="blackShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="60" cy="60" r="54" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <g filter="url(#blackShadow)">
    <clipPath id="blackCircleClip">
      <circle cx="60" cy="60" r="46"/>
    </clipPath>

    <g clip-path="url(#blackCircleClip)">
      <!-- Deep Rich Organic Humus Base -->
      <rect x="10" y="10" width="100" height="100" fill="url(#blackEarthBg)"/>

      <!-- Lower Horizon Black Earth Crumb Layer -->
      <path d="M10 60 Q34 52 64 58 T110 52 L110 110 L10 110 Z" fill="url(#humusDeep)"/>
      <path d="M10 78 Q48 72 82 76 T110 72 L110 110 L10 110 Z" fill="#000000"/>

      <!-- Organic Humus Aggregates & Soil Crumbs -->
      <ellipse cx="32" cy="42" rx="4" ry="3" fill="#64748B"/>
      <ellipse cx="84" cy="38" rx="4.5" ry="3.2" fill="#64748B"/>
      <ellipse cx="26" cy="66" rx="5" ry="3.5" fill="#334155"/>
      <ellipse cx="58" cy="72" rx="6" ry="4" fill="#334155"/>
      <ellipse cx="88" cy="68" rx="5" ry="3.8" fill="#334155"/>

      <!-- Rich Nutrient Sparkle Dots -->
      <circle cx="40" cy="50" r="1.5" fill="#FDE047"/>
      <circle cx="76" cy="46" r="1.5" fill="#FDE047"/>
      <circle cx="68" cy="84" r="1.5" fill="#FDE047"/>
      <circle cx="34" cy="80" r="1.5" fill="#FDE047"/>

      <!-- Healthy Earthworm Silhouette in Organic Soil -->
      <path d="M74 88 C78 84 84 84 88 88 C92 92 98 90 102 86" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Thriving Dual-Leaf Seedling Sprouting Out of Fertile Soil -->
      <!-- Taproot down into earth -->
      <path d="M60 52 C60 62 58 72 62 82" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Stem up into light -->
      <path d="M60 52 C60 40 60 30 60 24" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Left Cotyledon Leaf -->
      <path d="M60 28 C48 24 38 32 46 40 C54 44 58 36 60 28 Z" fill="url(#sproutGrad)" stroke="#15803D" stroke-width="1.2"/>
      <path d="M60 28 C52 32 48 36 46 40" stroke="#BBF7D0" stroke-width="1" fill="none"/>
      <!-- Right Cotyledon Leaf -->
      <path d="M60 28 C72 24 82 32 74 40 C66 44 62 36 60 28 Z" fill="url(#sproutGrad)" stroke="#15803D" stroke-width="1.2"/>
      <path d="M60 28 C68 32 72 36 74 40" stroke="#BBF7D0" stroke-width="1" fill="none"/>
    </g>

    <!-- Outer Protective Ring Accent -->
    <circle cx="60" cy="60" r="46" fill="none" stroke="#22C55E" stroke-width="3"/>
  </g>
</svg>
